spring:
  profiles:
    default: local
  application:
    name: mesapp-backend
  datasource:
    url: ${MESAPP_DB_URL:jdbc:postgresql://localhost:5432/mesapp}
    username: ${MESAPP_DB_USER:mesapp}
    password: ${MESAPP_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  address: ${MESAPP_BIND_ADDRESS:0.0.0.0}
  port: ${MESAPP_PORT:8080}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: strict
        secure: ${MESAPP_COOKIE_SECURE:false}
mesapp:
  printer-token: ${MESAPP_PRINTER_TOKEN:}
  sync-token: ${MESAPP_SYNC_TOKEN:}
  sync-tenants: ${MESAPP_SYNC_TENANTS:}
  central-url: ${MESAPP_CENTRAL_URL:}
management:
  endpoints:
    web:
      exposure:
        include: health,info
---
spring:
  config:
    activate:
      on-profile: local
mesapp:
  deployment-mode: local
---
spring:
  config:
    activate:
      on-profile: central
mesapp:
  deployment-mode: central
