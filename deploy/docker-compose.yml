name: mesapp
services:
  postgres-local:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mesapp_local
      POSTGRES_USER: ${MESAPP_DB_USER:?Define MESAPP_DB_USER en .env}
      POSTGRES_PASSWORD: ${MESAPP_DB_PASSWORD:?Define MESAPP_DB_PASSWORD en .env}
    volumes:
      - mesapp-local-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d mesapp_local"]
      interval: 5s
      timeout: 3s
      retries: 15
  postgres-central:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mesapp_central
      POSTGRES_USER: ${MESAPP_DB_USER:?Define MESAPP_DB_USER en .env}
      POSTGRES_PASSWORD: ${MESAPP_DB_PASSWORD:?Define MESAPP_DB_PASSWORD en .env}
    volumes:
      - mesapp-central-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d mesapp_central"]
      interval: 5s
      timeout: 3s
      retries: 15
  backend-local:
    build: ../backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      MESAPP_DB_URL: jdbc:postgresql://postgres-local:5432/mesapp_local
      MESAPP_DB_USER: ${MESAPP_DB_USER:?}
      MESAPP_DB_PASSWORD: ${MESAPP_DB_PASSWORD:?}
      MESAPP_RESTAURANT_ID: ${MESAPP_RESTAURANT_ID:-11111111-1111-4111-8111-111111111111}
      MESAPP_INSTALLATION_ID: ${MESAPP_INSTALLATION_ID:-22222222-2222-4222-8222-222222222222}
      MESAPP_BOOTSTRAP_ADMIN_NAME: ${MESAPP_BOOTSTRAP_ADMIN_NAME:?}
      MESAPP_BOOTSTRAP_ADMIN_PIN: ${MESAPP_BOOTSTRAP_ADMIN_PIN:?}
      MESAPP_PRINTER_TOKEN: ${MESAPP_PRINTER_TOKEN:?}
      MESAPP_SYNC_TOKEN: ${MESAPP_SYNC_TOKEN:?}
      MESAPP_CENTRAL_URL: http://backend-central:8080
    depends_on:
      postgres-local: { condition: service_healthy }
      backend-central: { condition: service_healthy }
    ports:
      - "${MESAPP_BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 35s
  backend-central:
    build: ../backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: central
      MESAPP_DB_URL: jdbc:postgresql://postgres-central:5432/mesapp_central
      MESAPP_DB_USER: ${MESAPP_DB_USER:?}
      MESAPP_DB_PASSWORD: ${MESAPP_DB_PASSWORD:?}
      MESAPP_RESTAURANT_ID: ${MESAPP_RESTAURANT_ID:-11111111-1111-4111-8111-111111111111}
      MESAPP_INSTALLATION_ID: ${MESAPP_INSTALLATION_ID:-22222222-2222-4222-8222-222222222222}
      MESAPP_SYNC_TOKEN: ${MESAPP_SYNC_TOKEN:?}
      MESAPP_SYNC_TENANTS: ${MESAPP_SYNC_TENANTS:-}
    depends_on:
      postgres-central: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 35s
  frontend:
    build: ../frontend
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://backend-local:8080
    ports:
      - "${MESAPP_FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend-local: { condition: service_healthy }
volumes:
  mesapp-local-data:
  mesapp-central-data:
